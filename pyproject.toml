[project]
name = "wallapop-cli"
version = "0.2.0"
description = "Search Wallapop (Spain and Portugal) from the terminal"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Jean Galea" }]
dependencies = [
    "curl-cffi>=0.13",
    "typer>=0.12",
    "rich>=13.7",
    "pycookiecheat>=0.8",
]

[project.scripts]
wallapop = "wallapop.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wallapop"]
